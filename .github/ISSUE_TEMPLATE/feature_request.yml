name: Feature request
description: Suggest an improvement to apple-offload
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and why it matters
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: checkboxes
    id: boundary
    attributes:
      label: Boundary
      options:
        - label: I checked this against the product boundary in CLAUDE.md
          required: true
